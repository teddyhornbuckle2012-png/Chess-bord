<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Geometric Chess</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="game-header">
            <div class="game-info">
                <div class="player-info human-info">
                    <span class="player-label">Human</span>
                    <div class="captured-pieces human-captured" id="human-captured"></div>
                    <div class="timer" id="human-timer">5:00</div>
                </div>
                <div class="game-status" id="game-status">
                    <span class="status-text" id="status-text">White to move</span>
                    <button class="new-game-btn" id="new-game-btn">New Game</button>
                </div>
                <div class="player-info ai-info">
                    <span class="player-label">AI</span>
                    <div class="captured-pieces ai-captured" id="ai-captured"></div>
                    <div class="timer" id="ai-timer">5:00</div>
                </div>
            </div>
        </header>

        <main class="game-container">
            <div class="board-wrapper">
                <div class="board-container" id="board-container">
                    <div class="board" id="board"></div>
                </div>
                <div class="coordinates file-coords" id="file-coords"></div>
                <div class="coordinates rank-coords" id="rank-coords"></div>
            </div>

            <aside class="sidebar">
                <div class="move-history" id="move-history">
                    <h3>Move History</h3>
                    <div class="moves-list" id="moves-list"></div>
                </div>
                <div class="game-controls">
                    <button class="control-btn" id="undo-btn" disabled>Undo Move</button>
                    <button class="control-btn" id="flip-btn">Flip Board</button>
                    <div class="difficulty-selector">
                        <label for="difficulty">Difficulty:</label>
                        <select id="difficulty">
                            <option value="1">Easy (1 ply)</option>
                            <option value="2">Medium (2 ply)</option>
                            <option value="3" selected>Hard (3 ply)</option>
                            <option value="4">Expert (4 ply)</option>
                        </select>
                    </div>
                </div>
            </aside>
        </main>

        <div class="modal" id="promotion-modal">
            <div class="modal-content">
                <h3>Promote Pawn</h3>
                <div class="promotion-options" id="promotion-options">
                    <button class="promotion-option" data-piece="queen">
                        <svg class="piece-icon" viewBox="0 0 100 100"><use href="#queen-cream"></use></svg>
                    </button>
                    <button class="promotion-option" data-piece="rook">
                        <svg class="piece-icon" viewBox="0 0 100 100"><use href="#rook-cream"></use></svg>
                    </button>
                    <button class="promotion-option" data-piece="bishop">
                        <svg class="piece-icon" viewBox="0 0 100 100"><use href="#bishop-cream"></use></svg>
                    </button>
                    <button class="promotion-option" data-piece="knight">
                        <svg class="piece-icon" viewBox="0 0 100 100"><use href="#knight-cream"></use></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="modal" id="game-over-modal">
            <div class="modal-content">
                <h2 id="game-over-title">Game Over</h2>
                <p id="game-over-message"></p>
                <button class="modal-close" id="game-over-close">New Game</button>
            </div>
        </div>
